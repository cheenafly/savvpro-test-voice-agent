# Training utterances for the intent classifier (app/nlu/train.py).
# Written as callers actually speak: informal, Pakistani-English phrasing,
# some Urdu words, and speech-to-text mistakes (split/misspelled words, missing
# punctuation). All names and numbers are invented.

